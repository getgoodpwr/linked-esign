<script>
// Apps Script web app that acts as the backend API (Deploy > Manage deployments > Web app URL)
const API_URL='https://script.google.com/macros/s/AKfycbzCAdKfF0CZkgzOPibCX6wDpS7lbmGfgyGWjsa8dNpz32_jT-22JvI42_QbphyACyWu2g/exec';

const ST={DRAFT:'Draft',SENT:'Sent',VIEWED:'Viewed',PARTIALLY_SIGNED:'Partially signed',COMPLETED:'Completed',VOIDED:'Voided',DECLINED:'Declined',EXPIRED:'Expired'};
const COL=['#2b2b2d','#5f7288','#9a6b4f','#7a5c7a','#5f7a64','#a07f3a'];
const TYPES={signature:'Signature',initials:'Initials',date:'Date signed',text:'Text',checkbox:'Checkbox',name:'Name',email:'Email',company:'Company',title:'Title',number:'Number',longtext:'Long text'};
const SIZE={signature:[.25,.06],initials:[.1,.05],date:[.18,.035],text:[.25,.035],checkbox:[.03,.025],name:[.25,.035],email:[.25,.035],company:[.25,.035],title:[.25,.035],number:[.15,.035],longtext:[.45,.13]};
const MAXC={text:500,company:500,title:500,longtext:5000,number:20};   // most characters each type may hold
const capOf=(type,wPt,hPt)=>Math.max(20,Math.min(MAXC[type]||500,Math.floor(Math.max(1,Math.floor((wPt-4)/2.75))*Math.max(1,Math.floor(hPt/6.3))*.9)));   // about how many characters fit in a box at a readable size
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{const i=document.createElement('textarea');i.value=t;i.style.cssText='position:fixed;opacity:0';document.body.appendChild(i);i.select();const ok=document.execCommand('copy');i.remove();return ok}catch(e2){return false}}};
const cleanEm=v=>String(v==null?'':v).replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD\u00A0\u3000]/g,'').replace(/\s+/g,'').replace(/^[<"'(]+|[>"'),.;:]+$/g,'').toLowerCase();
const numOk=v=>{v=String(v).replace(/[,\s]/g,'');return v===''||/^-?\d{1,15}(\.\d{1,6})?$/.test(v)};
let S={token:null,user:null};try{S.token=sessionStorage.getItem('gp')}catch(e){}
const CDN='https://cdnjs.cloudflare.com/ajax/libs/',_lp={};
const loadScript=u=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.async=true;e.onload=res;e.onerror=()=>rej(new Error('A required component could not be loaded. Check your connection or ad blocker, then refresh.'));document.head.appendChild(e)});
function needLib(k){return _lp[k]||(_lp[k]=(k==='pdf'?Promise.all([loadScript(CDN+'pdf.js/3.11.174/pdf.min.js'),loadScript(CDN+'pdf.js/3.11.174/pdf.worker.min.js')]).then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.js/3.11.174/pdf.worker.min.js'}):loadScript(CDN+'pdf-lib/1.17.1/pdf-lib.min.js')).catch(e=>{delete _lp[k];throw e}))}
const ssGet=k=>{try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},ssSet=(k,v)=>{try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('gp-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdf');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 return{get:k=>open().then(db=>new Promise(res=>{const q=db.transaction('pdf').objectStore('pdf').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})).catch(()=>null),
 set:(k,v)=>open().then(db=>{db.transaction('pdf','readwrite').objectStore('pdf').put(v,k)}).catch(()=>{}),
 clear:()=>open().then(db=>{db.transaction('pdf','readwrite').objectStore('pdf').clear()}).catch(()=>{})}})();
async function cachedPdf(key,fetcher){const c=await idb.get(key);if(c)return c;const b=await fetcher();idb.set(key,b);return b}
function fatal(m){const r=$('#root');if(r&&!r.querySelector('.card,.sgn,#app'))r.innerHTML='<div style="padding:40px;max-width:480px;margin:auto"><div class="logo" style="padding-left:0">GOODPWR E-SIGN</div><h3>This page could not finish loading</h3><p class="sub">'+esc(m)+'</p><p class="sub">Please refresh. If it keeps happening, send this message to the sender.</p></div>'}
window.addEventListener('error',e=>fatal(e.message));window.addEventListener('unhandledrejection',e=>fatal(String((e.reason&&e.reason.message)||e.reason)));
const openPdf=async b64=>{await needLib('pdf');return pdfjsLib.getDocument({data:bytes(b64),isEvalSupported:false}).promise};
const uid=()=>'t'+Math.random().toString(36).slice(2,10);
const bytes=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function toast(m,k){const d=document.createElement('div');d.className='t '+(k||'');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4500)}
function call(action,p,ms){return new Promise((res,rej)=>{let done=false;const fin=f=>{if(done)return;done=true;clearTimeout(t);f()};
 const t=setTimeout(()=>fin(()=>rej(new Error('The request timed out. Please try again.'))),ms||60000);
 fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,session:S.token,p:p||{}}),redirect:'follow'})
 .then(r=>r.text()).then(txt=>fin(()=>{let r;try{r=JSON.parse(txt)}catch(e){console.error('Unexpected server response:',txt.slice(0,400));return rej(new Error('The server replied, but not with data the app understands. In Apps Script, redeploy as a NEW VERSION with access set to Anyone.'))}
  if(r&&r.ok)return res(r.data);
  if(r&&r.error==='SESSION_EXPIRED'){signOut(true);return rej(new Error('Your session has expired. Please sign in again.'))}rej(new Error(r&&r.error?r.error:'Something went wrong. Please try again.'))}))
 .catch(e=>fin(()=>{console.error('Network error:',e);rej(new Error('Unable to connect to GOODPWR E-SIGN. Please try again. (If this keeps happening, open the web app link in a new tab; it should say "GOODPWR E-SIGN API is running".)'))}))})}
async function busy(btn,label,fn){if(btn.disabled)return;const o=btn.textContent;btn.disabled=true;btn.textContent=label;try{return await fn()}catch(e){toast(e.message,'e')}finally{btn.disabled=false;btn.textContent=o}}
function modal(html){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md" role="dialog">'+html+'</div>';document.body.appendChild(o);o.close=()=>o.remove();return o}
function confirmBox(msg,label){return new Promise(r=>{const o=modal('<h3>Are you sure?</h3><p>'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" id="n">Cancel</button><button class="btn p" id="y">'+esc(label||'Confirm')+'</button></div>');
 o.querySelector('#n').onclick=()=>{o.close();r(false)};o.querySelector('#y').onclick=()=>{o.close();r(true)}})}
const fmt=d=>d?new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'-';
function signOut(silent){if(!silent&&S.token)call('logout').catch(()=>{});S.token=null;try{['gp','gpu','gpd','gpt'].forEach(k=>sessionStorage.removeItem(k))}catch(e){}DOCS=[];idb.clear();renderLogin(silent?'Your session has expired. Please sign in again.':'')}

/* ===== boot ===== */

function renderLogin(msg){$('#root').innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="width:100%;max-width:380px;padding:28px"><div class="logo" style="padding-left:0">GOODPWR E-SIGN</div><h1>Sign in</h1><p class="sub">Use your @getgoodpwr.com email to sign in.</p>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+
 '<label>Name<input id="nm" autocomplete="name"></label><br><br><label>Email<input id="em" type="email" placeholder="you@getgoodpwr.com" autocomplete="username"></label><br><br><button class="btn p" id="go" style="width:100%">Sign in</button></div></div>';
 const go=()=>busy($('#go'),'Signing in...',async()=>{const r=await call('login',{name:$('#nm').value,email:cleanEm($('#em').value)});S.token=r.token;S.user=r.user;try{sessionStorage.setItem('gp',r.token);sessionStorage.setItem('gpu',JSON.stringify(r.user))}catch(e){}if(r.docs){DOCS=r.docs;ssSet('gpd',DOCS)}renderShell('dash')});
 $('#go').onclick=go;$('#em').onkeydown=e=>{if(e.key==='Enter')go()}}

/* ===== shell ===== */
let page='dash';
function renderShell(p){page=p;const u=S.user,nav=[['dash','Dashboard'],['docs','Documents'],['tpl','Templates'],['fav','Favorites'],['send','Send for Signature'],['team','Team']];
 $('#root').innerHTML='<div id="app"><aside id="side"><div class="logo">GOODPWR E-SIGN</div><nav class="nav">'+nav.map(n=>'<a data-p="'+n[0]+'" class="'+(n[0]===p?'on':'')+'">'+n[1]+'</a>').join('')+'</nav><div id="me" style="margin-top:auto;font-size:12px"><b>'+esc(u.name)+'</b><br>'+esc(u.email)+'<br>'+esc(u.role)+' · '+esc(u.company)+'<br><button class="btn s" id="so" style="margin-top:8px">Sign out</button></div></aside><main id="main"></main></div>';
 document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>renderShell(a.dataset.p));$('#so').onclick=()=>signOut();
 ({dash:viewDash,docs:viewDocs,send:()=>viewSend(),tpl:viewTpl,fav:viewFav,team:viewTeam})[p]()}
const skel=()=>'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
function empty(t,s,btn){return '<div class="empty"><h3>'+t+'</h3><p class="sub">'+s+'</p>'+(btn||'')+'</div>'}

/* ===== dashboard & documents ===== */
let DOCS=ssGet('gpd')||[];
async function loadDocs(){DOCS=(await call('getDocuments')).docs;ssSet('gpd',DOCS)}
async function viewDash(){const m=$('#main');m.innerHTML='<h1>Good '+(new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening')+', '+esc(S.user.name.split(' ')[0])+'</h1><p class="sub">Here\'s what\'s happening with your documents.</p>'+skel();
 const paint=()=>{const n=f=>DOCS.filter(f).length,soon=Date.now()+3*864e5,live=d=>['SENT','VIEWED','PARTIALLY_SIGNED'].includes(d.status);
 const c=[['Action Required',n(d=>d.mine)],['My Documents',n(d=>d.relation==='owner')],['Shared With Me',n(d=>d.relation==='shared')],['Favorites',n(d=>d.favorite)],['Waiting for Others',n(d=>d.relation==='owner'&&live(d)&&!d.mine)],['Completed',n(d=>d.status==='COMPLETED')],['Drafts',n(d=>d.status==='DRAFT')],['Expiring Soon',n(d=>live(d)&&d.expiresAt&&new Date(d.expiresAt)<soon)]];
 m.innerHTML='<div class="top"><div><h1>Good '+(new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening')+', '+esc(S.user.name.split(' ')[0])+'</h1><p class="sub" style="margin:0">Here\'s what\'s happening with your documents.</p></div><button class="btn p" id="ns">Send for Signature</button></div><div class="cards">'+c.map(x=>'<div class="card stat"><b>'+x[1]+'</b>'+x[0]+'</div>').join('')+'</div><div class="card"><h3>Recent Documents</h3><div id="tbl"></div></div>';
 $('#ns').onclick=()=>renderShell('send');docTable($('#tbl'),DOCS.slice(0,8))};
 if(DOCS.length)paint();try{await loadDocs();paint()}catch(e){if(!DOCS.length)m.innerHTML+='<div class="err">'+esc(e.message)+'</div>'}}
const PL={VIEW:'Can view',USE:'Can use',EDIT:'Can edit',MANAGE:'Can manage',OWNER:'Owner',RECIPIENT:'Recipient'},RK={OWNER:5,MANAGE:4,EDIT:3,USE:2,VIEW:1,RECIPIENT:.5},can=(x,m)=>(RK[x.permission]||0)>=RK[m];
const starB=(it,a)=>'<button class="btn s" title="Favorite" data-a="'+a+'" data-id="'+it.id+'" style="font-size:15px">'+(it.favorite?'★':'☆')+'</button>';
const sharedList=l=>l.map(s=>esc(s.name)+' — '+PL[s.permission]+' · '+new Date(s.sharedAt).toLocaleDateString()).join('<br>');

function viewDocs(){const m=$('#main');m.innerHTML='<div class="top"><h1>Documents</h1><button class="btn p" id="ns">Send for Signature</button></div><div class="card"><div class="tabs" id="tabs"></div><div class="row" style="margin-bottom:10px"><input id="q" placeholder="Search documents or recipients" class="grow"><select id="stf" style="width:auto"><option value="">All statuses</option><option value="DRAFT">Draft</option><option value="LIVE">In progress</option><option value="COMPLETED">Completed</option><option value="VOIDED">Voided</option></select><select id="sort" style="width:auto"><option value="u">Newest activity</option><option value="n">Name</option></select></div><div id="tbl">'+skel()+'</div></div>';
 $('#ns').onclick=()=>renderShell('send');
 const tabs=[['mine','My Documents',d=>d.relation==='owner',"You haven't created any documents yet."],['shared','Shared With Me',d=>d.relation==='shared','No documents have been shared with you.'],['others','Shared to Others',d=>d.relation==='owner'&&d.sharedWith.length>0,"You haven't shared any documents yet."],['fav','Favorites',d=>d.favorite,'No favorites yet.'],['act','Action Required',d=>d.mine,'Nothing needs your signature right now.']];let cur='mine';
 const draw=()=>{$('#tabs').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;draw()});
  const q=$('#q').value.toLowerCase(),sf=$('#stf').value,t=tabs.find(x=>x[0]===cur);let l=DOCS.filter(t[2]).filter(d=>!q||(d.name+d.recipients.map(r=>r.name+r.email).join(' ')).toLowerCase().includes(q)).filter(d=>!sf||(sf==='LIVE'?['SENT','VIEWED','PARTIALLY_SIGNED'].includes(d.status):d.status===sf));

async function renderPdf(box,b64){const pdf=await openPdf(b64);if(!pdf.numPages)throw new Error('empty');box.innerHTML='';const layers=[],jobs=[],W=(box.clientWidth||window.innerWidth||800)-24,dpr=window.devicePixelRatio>1?1.5:1;

  const d=document.createElement('div');d.className='pg ld';d.style.width=(v0.width*sc)+'px';d.style.height=(v0.height*sc)+'px';const cv=document.createElement('canvas');d.appendChild(cv);
  const ly=document.createElement('div');ly.className='lay';ly.dataset.page=i;d.appendChild(ly);box.appendChild(d);layers.push(ly);jobs.push({pg:pg,cv:cv,sc:sc,d:d,done:false})}
 const paint=j=>{if(j.done)return Promise.resolve();j.done=true;const vp=j.pg.getViewport({scale:j.sc*dpr});j.cv.width=vp.width;j.cv.height=vp.height;return j.pg.render({canvasContext:j.cv.getContext('2d'),viewport:vp}).promise.then(()=>j.d.classList.remove('ld'))};
